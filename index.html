<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>iPhone</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  .iphone {
    width: 375px;
    height: 812px;
    background: #000;
    border-radius: 50px;
    border: 12px solid #1c1c1e;
    position: relative;
    box-shadow: 0 0 0 2px #333, 0 20px 60px rgba(0,0,0,0.8);
    overflow: hidden;
  }
  .notch {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 160px; height: 30px;
    background: #000;
    border-radius: 0 0 20px 20px;
    z-index: 10;
  }
  .screen {
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
    padding: 60px 30px;
  }
  .time {
    position: absolute;
    top: 14px; left: 30px;
    font-size: 15px; font-weight: 600;
    z-index: 5;
  }
  .battery {
    position: absolute;
    top: 16px; right: 30px;
    width: 27px; height: 13px;
    border: 2px solid #fff;
    border-radius: 3px;
    z-index: 5;
  }
  .battery::after {
    content: '';
    position: absolute;
    right: -5px; top: 3px;
    width: 3px; height: 5px;
    background: #fff;
    border-radius: 0 2px 2px 0;
  }
  .battery-level {
    position: absolute;
    top: 3px; left: 3px;
    width: 17px; height: 5px;
    background: #34c759;
    border-radius: 1px;
  }
  h1 {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -1px;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 17px;
    opacity: 0.7;
    margin-bottom: 40px;
  }
  .app-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    width: 100%;
  }
  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .app-icon {
    width: 60px; height: 60px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  .app-label {
    font-size: 11px;
    opacity: 0.85;
  }
  .dock {
    position: absolute;
    bottom: 20px; left: 20px; right: 20px;
    height: 80px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    border-radius: 28px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 10px;
  }
  .dock .app-icon { width: 52px; height: 52px; border-radius: 12px; }
</style>
</head>
<body>
  <div class="iphone">
    <div class="notch"></div>
    <div class="time">9:41</div>
    <div class="battery"><div class="battery-level"></div></div>
    <div class="screen">
      <h1>Hello World</h1>
      <p class="subtitle">Running on your Tesla</p>
      <div class="app-grid">
        <div class="app"><div class="app-icon" style="background:#ff3b30">📷</div><span class="app-label">Camera</span></div>
        <div class="app"><div class="app-icon" style="background:#34c759">🎵</div><span class="app-label">Music</span></div>
        <div class="app"><div class="app-icon" style="background:#007aff">🗺️</div><span class="app-label">Maps</span></div>
        <div class="app"><div class="app-icon" style="background:#af52de">💬</div><span class="app-label">Messages</span></div>
        <div class="app"><div class="app-icon" style="background:#ff9500">🌤️</div><span class="app-label">Weather</span></div>
        <div class="app"><div class="app-icon" style="background:#5ac8fa">📞</div><span class="app-label">Phone</span></div>
        <div class="app"><div class="app-icon" style="background:#ff2d55">❤️</div><span class="app-label">Health</span></div>
        <div class="app"><div class="app-icon" style="background:#5856d6">⚙️</div><span class="app-label">Settings</span></div>
      </div>
    </div>
    <div class="dock">
      <div class="app-icon" style="background:#007aff">📞</div>
      <div class="app-icon" style="background:#34c759">🌐</div>
      <div class="app-icon" style="background:#ff3b30">📷</div>
      <div class="app-icon" style="background:#ff9500">🎵</div>
    </div>
  </div>
</body>
</html>
